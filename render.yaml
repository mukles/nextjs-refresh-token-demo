services:
  - type: web
    runtime: node
    name: nextjs-refresh-token-api
    buildCommand: npm ci --include=dev && npm run build --workspace=@repo/api
    startCommand: npm run start --workspace=@repo/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: 60
      - key: REFRESH_TOKEN_TTL_SECONDS
        value: 604800
