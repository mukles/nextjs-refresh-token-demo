services:
  mongodb:
    image: mongo:8
    container_name: refresh-token-demo-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'try { rs.status().ok } catch (error) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}).ok }'",
        ]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  mongodb_data:
